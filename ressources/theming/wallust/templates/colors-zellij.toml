[template]
name = "zellij"
extension = "yaml"

[colors]
background = "{{background}}"
foreground = "{{foreground}}"
black = "{{color0}}"
red = "{{color1}}"
green = "{{color2}}"
yellow = "{{color3}}"
blue = "{{color4}}"
magenta = "{{color5}}"
cyan = "{{color6}}"
white = "{{color7}}"
bright_black = "{{color8}}"
bright_red = "{{color9}}"
bright_green = "{{color10}}"
bright_yellow = "{{color11}}"
bright_blue = "{{color12}}"
bright_magenta = "{{color13}}"
bright_cyan = "{{color14}}"
bright_white = "{{color15}}"


