# Keybindings — rebuilt from niri's binds.kdl so muscle memory carries over.
# Reference: docs/bindings/keys.md in the mango source (0.16.3).
#
# ~/.config/mango/config.conf fully REPLACES /etc/mango/config.conf, so none of
# mango's stock binds apply unless listed here. The stock set was deliberately
# dropped: it lives on Alt/Ctrl (Alt+Arrows, Alt+1-9, Ctrl+1-9, Alt+Tab,
# Ctrl+Shift+Arrows...) and hijacks browser/editor shortcuts that niri leaves
# alone, and Super+M = quit sat right next to Super+Shift+M = wallpaper.
#
# Syntax: bind[flags]=MODS,KEY,DISPATCHER[,ARGS]. Mods: super ctrl alt shift none.
# Flags: l = works while locked, r = on release, c = allow duplicate combo.
# Key names are case-insensitive (matched by keycode); use `wev` to find them.
# Only Ctrl+Alt+F1..F12 (VT switch) is built in and can't be overridden.
#
# Mapping cheat-sheet (niri -> mango): column = window in the scroller strip,
# workspace = tag, consume/expel into column = scroller_stack up/down.

# --- session -----------------------------------------------------------------
bind=SUPER+SHIFT,Escape,reload_config
# niri: Mod+Shift+E / Ctrl+Alt+Delete { quit } (niri confirms; mango doesn't)
bind=CTRL+ALT,Delete,quit
bind=SUPER,Q,killclient,
bind=SUPER+SHIFT,Q,killclient,force
# bindl=SUPER,Escape,spawn,noctalia-shell ipc call lockScreen lock  # noctalia v4
# bindl=SUPER,Escape,spawn,noctalia msg session lock  # noctalia v5
bindl=SUPER,Escape,spawn,shellseikatsu ipc call session lock
# niri: Mod+Escape { toggle-keyboard-shortcuts-inhibit } — mango has no toggle,
# per-window control is `windowrule=allow_shortcuts_inhibit:0,...` instead.

# --- launchers / scripts (niri binds.kdl) -----------------------------------
bind=SUPER+SHIFT,M,spawn,~/.config/nixos/scripts/wall_cycle.sh
bind=SUPER+SHIFT,N,spawn,~/.config/nixos/scripts/wall_cycle_back.sh
# niri: Mod+Shift+V toggles blur/animations/opacity (mango_toggle_effects.sh
# uses `mmsg dispatch setoption` — no config rewrite needed)
bind=SUPER+SHIFT,V,spawn,~/.config/nixos/scripts/mango_toggle_effects.sh
bind=SUPER,A,spawn,foot --title fsel-launcher fsel -d
bind=SUPER,O,spawn,foot --title obsidian-nvim -D ~/Documents/obsidian/ nvim .
bind=SUPER,N,spawn,foot --title nixos-config-nvim -D ~/.config/nixos/ nvim .
bind=SUPER,T,spawn,foot
bind=SUPER+SHIFT,T,spawn,ghostty
bind=SUPER,Y,spawn,zen-twilight
bind=SUPER,B,spawn,microsoft-edge
bind=SUPER,E,spawn,nautilus
bind=SUPER,R,spawn,shellseikatsu ipc call launcher toggle
bind=SUPER,Z,spawn,shellseikatsu ipc call console toggle
bind=SUPER,S,spawn,shellseikatsu ipc call sidebar toggle dashboard
# noctalia v4 -> v5: `noctalia-shell ipc call ...` became `noctalia msg ...`
# bind=SUPER+SHIFT,B,spawn,noctalia-shell ipc call bar toggle  # noctalia v4
# bind=SUPER,P,spawn,noctalia-shell ipc call launcher clipboard  # noctalia v4
bind=SUPER+SHIFT,B,spawn,noctalia msg bar-toggle
bind=SUPER,P,spawn,noctalia msg panel-toggle clipboard
# v5 extras: control-center / session panels (niri binds.kdl has the same)
bind=SUPER+SHIFT,P,spawn,noctalia msg panel-toggle control-center
bind=SUPER+CTRL,P,spawn,noctalia msg panel-toggle session
# niri: Mod+Shift+R was niri-session-restore-picker (niri-only). Reused for
# mango's own "cycle scroller width preset" since Mod+[ handles it too.
bind=SUPER+SHIFT,R,switch_proportion_preset,

# --- focus (niri: focus-column-or-monitor-*, focus-window-or-monitor-*) -----
# focus_cross_monitor=1 in config.conf makes focusdir hop monitors at the edge.
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
# niri: Mod+Home / Mod+End (focus-column-first/last) — no direct equivalent;
# focusstack cycles the whole strip instead.
bind=SUPER,Home,focusstack,prev
bind=SUPER,End,focusstack,next
# niri: Mod+Shift+F { switch-focus-between-floating-and-tiling } ~ focuslast
bind=SUPER+SHIFT,F,focuslast,

# --- move window (niri: Super+Ctrl+Shift+* consume-or-expel / move-window-*) --
# Left/Right swap the window with its neighbour column; Up/Down move it into
# the column above/below (mango "stack") — that's niri's consume/expel.
bind=SUPER+CTRL+SHIFT,Left,exchange_client,left
bind=SUPER+CTRL+SHIFT,Right,exchange_client,right
bind=SUPER+CTRL+SHIFT,Up,scroller_stack,up
bind=SUPER+CTRL+SHIFT,Down,scroller_stack,down
bind=SUPER+CTRL+SHIFT,H,exchange_client,left
bind=SUPER+CTRL+SHIFT,L,exchange_client,right
bind=SUPER+CTRL+SHIFT,K,scroller_stack,up
bind=SUPER+CTRL+SHIFT,J,scroller_stack,down
# niri: Mod+Ctrl+Shift+Home/End (move-column-to-first/last)
bind=SUPER+CTRL+SHIFT,Home,exchange_stack_client,prev
bind=SUPER+CTRL+SHIFT,End,exchange_stack_client,next
# niri: Mod+Shift+Left/Right... were commented out; used here for the
# mango-only "pull neighbour into / push out of this column" via scroller_stack.
bind=SUPER+SHIFT,Left,scroller_stack,left
bind=SUPER+SHIFT,Right,scroller_stack,right

# --- window state ------------------------------------------------------------
bind=SUPER,W,togglefloating,
bind=ALT,Return,togglefullscreen,
# niri: Mod+Return { maximize-column } — fill the screen but keep bars
bind=SUPER,Return,togglemaximizescreen,
# niri: Mod+Alt+Return { expand-column-to-available-width }
bind=SUPER+ALT,Return,set_proportion,1.0
# niri: Mod+Alt+F { toggle-windowed-fullscreen }
bind=SUPER+ALT,F,togglefakefullscreen,
# niri: Mod+C { center-column } / Mod+Ctrl+C { center-visible-columns }
bind=SUPER,C,centerwin,
bind=SUPER+CTRL,C,set_proportion,0.5
# niri: Mod+G { toggle-column-tabbed-display } — mango's tabs are the monocle
# layout with its group bar; toggling via a layout switch is the nearest thing.
bind=SUPER,G,setlayout,monocle
bind=SUPER+SHIFT,G,setlayout,scroller
# mango-only: pin window on every tag (sticky) / always-on-top
bind=SUPER+SHIFT,U,toggleglobal,
bind=SUPER+SHIFT,O,toggleoverlay,

# --- column / window sizing (niri: set-column-width, set-window-height) ------
bind=SUPER,bracketleft,switch_proportion_preset,
bind=SUPER,bracketright,switch_proportion_preset,
bind=SUPER,minus,set_proportion,-0.1
bind=SUPER,equal,set_proportion,+0.1
bind=SUPER+SHIFT,H,set_proportion,-0.1
bind=SUPER+SHIFT,L,set_proportion,+0.1
# Height inside a stacked column: mango resizes tiled windows via resizewin
# with pixel deltas (niri used -10%/+10%).
bind=SUPER+SHIFT,minus,resizewin,+0,-80
bind=SUPER+SHIFT,equal,resizewin,+0,+80
bind=SUPER+SHIFT,K,resizewin,+0,-80
bind=SUPER+SHIFT,J,resizewin,+0,+80
# floating window nudge (mango-only)
bind=SUPER+ALT,Left,smartmovewin,left
bind=SUPER+ALT,Right,smartmovewin,right
bind=SUPER+ALT,Up,smartmovewin,up
bind=SUPER+ALT,Down,smartmovewin,down

# --- layouts (mango-only) ----------------------------------------------------
# cycles through circle_layout in config.conf; the per-tag default comes from
# tagrule in rules.conf, so switching only affects the current tag.
bind=SUPER+SHIFT,space,switch_layout
bind=SUPER+CTRL,S,setlayout,scroller
bind=SUPER+CTRL,T,setlayout,tile
bind=SUPER+CTRL,M,setlayout,monocle
bind=SUPER+CTRL,G,setlayout,grid
bind=SUPER+CTRL,D,setlayout,dwindle
bind=SUPER+CTRL,F,setlayout,fair
bind=SUPER+CTRL,E,setlayout,center_tile
bind=SUPER+CTRL,V,setlayout,vertical_scroller
# master-stack knobs (tile / center_tile)
bind=SUPER+CTRL,comma,incnmaster,+1
bind=SUPER+CTRL,period,incnmaster,-1
bind=SUPER+CTRL,minus,setmfact,-0.05
bind=SUPER+CTRL,equal,setmfact,+0.05
# dwindle: flip the split of the focused window
bind=SUPER+CTRL,Return,dwindle_toggle_current_split
# gaps
bind=SUPER+CTRL,bracketright,incgaps,2
bind=SUPER+CTRL,bracketleft,incgaps,-2
bind=SUPER+CTRL,backslash,togglegaps

# --- overview / switcher -----------------------------------------------------
# niri: Mod+Tab { toggle-overview }, Alt+Tab { focus-workspace-previous }
bind=SUPER,Tab,toggleoverview,
# mango-only: overview with vim-style jump labels (press the letter to focus)
bind=SUPER+SHIFT,Tab,togglejump,
# mango-only: thumbnail Alt-Tab style switcher (release Alt to select)
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev
bind=ALT,grave,switcher,all_tag_next
# niri: Alt+Tab { focus-workspace-previous } -> previous tagset
bind=SUPER,grave,view,-1,0

# --- workspaces / tags (niri: focus-workspace N, move-column-to-workspace N) -
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
# niri: Super+0 { focus-workspace 10 } -> mango: show all tags at once
bind=SUPER,0,view,0,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
# mango-only: move without following (niri has no equivalent)
bind=SUPER+ALT,1,tagsilent,1
bind=SUPER+ALT,2,tagsilent,2
bind=SUPER+ALT,3,tagsilent,3
bind=SUPER+ALT,4,tagsilent,4
bind=SUPER+ALT,5,tagsilent,5
bind=SUPER+ALT,6,tagsilent,6
bind=SUPER+ALT,7,tagsilent,7
bind=SUPER+ALT,8,tagsilent,8
bind=SUPER+ALT,9,tagsilent,9
# niri: Mod+Ctrl+O / Y / W / B { focus-workspace "orga"|"main"|"work" }
bind=SUPER+CTRL,O,view,1,0
bind=SUPER+CTRL,Y,view,3,0
bind=SUPER+CTRL,W,view,4,0
bind=SUPER+CTRL,B,view,4,0
# niri: Mod+Ctrl+Up/Down/Left/Right, Mod+Ctrl+J/K { focus-workspace-up/down }
# Up/Left = previous tag, Down/Right = next tag (niri workspaces stack vertically).
bind=SUPER+CTRL,Up,viewtoleft,0
bind=SUPER+CTRL,Down,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL,K,viewtoleft,0
bind=SUPER+CTRL,J,viewtoright,0
# Page_Up/Down: only tags that actually have windows (mango-only nicety)
bind=SUPER,Page_Up,viewtoleft_have_client,0
bind=SUPER,Page_Down,viewtoright_have_client,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0

# --- monitors ----------------------------------------------------------------
# niri: Mod+Ctrl+H/L { focus-monitor-left/right }
bind=SUPER+CTRL,H,focusmon,left
bind=SUPER+CTRL,L,focusmon,right
# niri: Mod+Alt+Ctrl+Left/Right/H/L { move-window-to-monitor-* }
bind=SUPER+ALT+CTRL,Left,tagmon,left,0
bind=SUPER+ALT+CTRL,Right,tagmon,right,0
bind=SUPER+ALT+CTRL,H,tagmon,left,0
bind=SUPER+ALT+CTRL,L,tagmon,right,0
# niri: Super+Ctrl+Return { move-window-to-monitor-next } — Return is taken by
# the dwindle split above; Super+Ctrl+Shift+Return does it instead.
bind=SUPER+CTRL+SHIFT,Return,tagmon,right,1
# niri: Mod+Alt+Shift+Ctrl+Left/Right { move-workspace-to-monitor-* } — mango
# tags are per-monitor and can't be moved as a unit; keeptag=1 keeps the
# window on the same tag number on the other monitor, which is the closest.
bind=SUPER+ALT+SHIFT+CTRL,Left,tagmon,left,1
bind=SUPER+ALT+SHIFT+CTRL,Right,tagmon,right,1
bind=SUPER+ALT+SHIFT+CTRL,H,tagmon,left,1
bind=SUPER+ALT+SHIFT+CTRL,L,tagmon,right,1

# --- scratchpad (mango-only) -------------------------------------------------
bind=SUPER,I,minimized,
bind=SUPER+SHIFT,I,restore_minimized,0
bind=SUPER+CTRL,Z,toggle_scratchpad
# named scratchpads: launch once, then toggle. rules.conf sizes them.
bind=SUPER,F1,toggle_named_scratchpad,scratch-term,none,foot --app-id scratch-term
bind=SUPER,F2,toggle_named_scratchpad,scratch-files,none,foot --app-id scratch-files yazi
bind=SUPER,F3,toggle_named_scratchpad,scratch-music,none,foot --app-id scratch-music --title spotify-tui spotatui

# --- screenshots (niri: screenshot / screenshot-window / Print) -------------
# mango has no built-in screenshot UI; grim/slurp/wl-copy stand in.
# spawn_shell (not spawn) is needed for $(...) and &&.
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png && notify-send "Screenshot" "Saved full screen"
bind=SUPER+SHIFT,S,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png
bind=ALT,Print,spawn_shell,g=$(mmsg get focusing-client | jq -r '"\(.x),\(.y) \(.width)x\(.height)"') && [ -n "$g" ] && grim -g "$g" ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png
bind=CTRL,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"

# --- mouse -------------------------------------------------------------------
# niri: Mod+drag moves, right-drag resizes. NONE+btn_middle only works on
# titlebars/overview in mango so it's left unbound.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+SHIFT,btn_left,togglefloating,
mousebind=SUPER+CTRL,btn_right,killclient,

# niri: Mod+WheelScrollDown/Up { focus-workspace-down/up }
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
# niri: Mod+Ctrl+WheelScroll { move-column-to-workspace-down/up }
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft
# niri: Mod+Shift+WheelScroll / Mod+WheelScrollLeft/Right { focus-column-left/right }
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
# niri: Mod+Ctrl+Shift+WheelScroll { move-column-right/left }
axisbind=SUPER+CTRL+SHIFT,DOWN,exchange_client,right
axisbind=SUPER+CTRL+SHIFT,UP,exchange_client,left

# --- media keys (niri: allow-when-locked=true -> bindl) ---------------------
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+

# --- laptop lid (niri: switch-events) ---------------------------------------
# niri's lid-close/open just fired notify-send; tablet-mode toggled the GNOME
# on-screen keyboard. mango only has fold/unfold. Requires logind's
# HandleLidSwitch=ignore to take over from systemd — left off for now, so this
# only adds the notification niri had.
switchbind=fold,spawn,notify-send "The laptop lid is closed!"
switchbind=unfold,spawn,notify-send "The laptop lid is open!"
