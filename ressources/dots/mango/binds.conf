# Keybindings. ~/.config/mango/config.conf fully replaces /etc/mango/config.conf
# rather than layering on top of it, so this file keeps mango's own well-tested
# default binds and appends the niri-parity binds (app launchers, workspace
# numbers, screenshots, lock, shellseikatsu/noctalia toggles) on keys that
# don't clash with them.
# mod key names: super, ctrl, alt, shift, none — https://github.com/mangowm/mango/wiki/keys

# reload / quit / close
bind=SUPER,r,reload_config
bind=SUPER,m,quit
bind=ALT,q,killclient,
bind=SUPER,Q,killclient,

# launchers (mango native)
bind=Alt,space,spawn,rofi -show drun
bind=Alt,Return,spawn,foot

# focus / stack
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# window state
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=SUPER,W,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout (mango's closest analogue to niri's scrolling columns)
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch (mango's numbered tags stand in for niri's named workspaces)
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# niri used Super+<n> for focus-workspace; mirror that alongside mango's own Ctrl+<n>
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# move focused window to tag: tag = move+follow, tagsilent = move without following
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# floating window move/resize
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# --- niri-parity: app launchers & scripts (from niri's binds.kdl) ---
bind=SUPER+SHIFT,M,spawn,~/.config/nixos/scripts/wall_cycle.sh
bind=SUPER+SHIFT,N,spawn,~/.config/nixos/scripts/wall_cycle_back.sh
bind=SUPER,Escape,spawn,shellseikatsu ipc call session lock
bind=SUPER,A,spawn,foot --title fsel-launcher fsel -d
bind=SUPER+SHIFT,O,spawn,foot --title obsidian-nvim -D ~/Documents/obsidian/ nvim .
bind=SUPER+CTRL,N,spawn,foot --title nixos-config-nvim -D ~/.config/nixos/ nvim .
bind=SUPER,T,spawn,foot
bind=SUPER+SHIFT,T,spawn,ghostty
bind=SUPER,Y,spawn,zen-twilight
bind=SUPER,B,spawn,microsoft-edge
bind=SUPER,E,spawn,nautilus
bind=SUPER+SHIFT,R,spawn,shellseikatsu ipc call launcher toggle
bind=SUPER,Z,spawn,shellseikatsu ipc call console toggle
bind=SUPER,S,spawn,shellseikatsu ipc call sidebar toggle dashboard
bind=SUPER+SHIFT,B,spawn,noctalia-shell ipc call bar toggle
bind=SUPER,P,spawn,noctalia-shell ipc call launcher clipboard

# --- niri-parity: screenshots. mango has no built-in screenshot UI like niri,
# so this shells out to grim/slurp instead of niri's `screenshot` action.
# Uses `spawn_shell` (documented separately from `spawn`) for the $(...) syntax.
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png
bind=SUPER+SHIFT,S,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png
bind=ALT,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png

# Mouse button bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --- niri-parity: media keys (mango ships none by default) ---
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+
