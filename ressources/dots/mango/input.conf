# Input devices — mirrors niri's input.kdl
# Reference: docs/configuration/input.md in the mango source (0.16.3)
# Validate with: mango -c ~/.config/mango/config.conf -p

# Keyboard
xkb_rules_layout=us,de
xkb_rules_variant=altgr-intl,
xkb_rules_options=grp:win_space_toggle
numlockon=1
repeat_rate=25
repeat_delay=600

# Trackpad — niri: tap on, natural-scroll on, adaptive accel, disable-while-typing.
# NOTE: several of these are prefixed `trackpad_` in mango. The unprefixed forms
# (disable_while_typing, left_handed, middle_button_emulation) are rejected by
# the parser as "Unknown keyword" and silently skipped.
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
# 0 = 1/2/3-finger tap -> left/right/middle (niri's default tap-button-map)
button_map=0
swipe_min_threshold=1

# Mouse — niri leaves natural-scroll off for the mouse
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_left_handed=0
mouse_middle_button_emulation=0

# Touchscreen — niri: touch { map-to-output "eDP-1" }
touch_enable=1
touch_map_to_mon=eDP-1

# Touchpad gestures (mango-only; niri has built-in 3-finger workspace swipes,
# mango exposes the equivalent as configurable bindings).
# 3-finger horizontal: scroll through columns like niri's 3-finger swipe
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
# 3-finger vertical: previous/next tag with a client
gesturebind=none,up,3,viewtoright_have_client
gesturebind=none,down,3,viewtoleft_have_client
# 4-finger up: overview (niri: 4-finger swipe up)
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
