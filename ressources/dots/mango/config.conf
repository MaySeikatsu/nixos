# Mango config — reconstructs the niri setup in ~/.config/nixos/ressources/dots/niri
# for this fundamentally different (dwl-based, tag/scroller) compositor.
# Option reference: docs/ in the mango source tree (nixpkgs ships 0.16.3), or
# https://github.com/mangowm/mango/wiki. Validate any edit before rebuilding:
#     mango -c ~/.config/mango/config.conf -p
# Reload at runtime with Super+Shift+Escape (reload_config), or `mmsg dispatch reload_config`.
#
# NOTE: unlike niri's `include`, this file fully replaces /etc/mango/config.conf
# rather than layering on top of it, so every file below is self-contained.

source=~/.config/mango/input.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/rules.conf

# --- Environment (niri: environment { ... } in config.kdl) -------------------
# NOTE: env= is (re)applied on every reload_config.
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=CLUTTER_BACKEND,wayland
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=ELM_DISPLAY,wl
env=GDK_BACKEND,wayland,x11
env=SDL_VIDEODRIVER,wayland
# mango embeds XWayland directly (no xwayland-satellite), DISPLAY is set by it.

# --- Effects ----------------------------------------------------------------
# What mango (dwl + scenefx) can do visually is exactly this block plus the
# animation block below: blur, shadows, corner radius, opacity. There is no
# custom-shader hook (niri's window-close custom-shader has no equivalent),
# no refraction/"liquid glass", and HDR only exists on the wl-only branch with
# the vulkan renderer, which the nixpkgs build doesn't use.
#
# Blur — mirrors niri's `blur { on passes 3 offset 3 noise 0.02 saturation 1.5 }`.
# blur_optimized=1 blurs against a cached *wallpaper* (cheap). Set it to 0 to
# blur against the real window stack behind (true frosted glass, much more GPU).
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.5

# niri: geometry-corner-radius 20, clip-to-geometry true
border_radius=20
no_radius_when_single=0
# niri fades inactive windows to 0.90 and the active one to 0.96 via
# is-active window-rules.
focused_opacity=0.96
unfocused_opacity=0.90

# Shadows — niri: shadow { on softness 30 spread 5 offset x=0 y=5 color "#00000070" }
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=5
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadowscolor=0x00000070

# --- Animations (niri: animations.kdl, slowdown 0.9, snappy springs) -------
# Types: slide | zoom | fade | none. Mango uses cubic-bezier curves, not
# springs; these approximate damping 0.75 / stiffness 600 (fast-out, slight
# overshoot).
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
tag_animation_direction=1
animation_duration_move=250
animation_duration_open=200
animation_duration_tag=180
animation_duration_close=250
animation_duration_focus=120
animation_curve_open=0.34,1.3,0.64,1
animation_curve_move=0.34,1.2,0.64,1
animation_curve_tag=0.2,0.9,0.2,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# --- Layouts ----------------------------------------------------------------
# Scroller = niri's horizontally scrolling column strip. Per-tag layout
# defaults live in rules.conf (tagrule). `circle_layout` is the list that
# Super+Shift+Space (switch_layout) cycles through; Super+Ctrl+<key> in
# binds.conf jump straight to one.
circle_layout=scroller,tile,center_tile,dwindle,monocle,grid

# Scroller (niri layout.kdl): default-column-width 0.5, preset widths
# 0.25/0.33/0.5/0.66/0.75/1.0, center-focused-column "never",
# always-center-single-column.
scroller_structs=20
scroller_default_proportion=0.5
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.25,0.33,0.5,0.66,0.75,1.0

# Master-stack (tile / center_tile)
new_is_master=1
default_mfact=0.55
default_nmaster=1
center_master_overspread=0
center_when_single_stack=1

# Dwindle (bspwm-style spiral)
dwindle_split_ratio=0.5
dwindle_smart_split=1
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Monocle tab bar (mango's analogue to niri's tabbed column display)
group_bar_height=32
group_bar_decorate_font_desc=monospace Bold 11
group_bar_decorate_corner_radius=8

# --- Tags -------------------------------------------------------------------
tag_num=9
smartgaps=0
tag_gather=0
# niri: workspace-auto-back-and-forth
view_current_to_back=1

# --- Overview (niri: Mod+Tab toggle-overview, 4-finger swipe) --------------
enable_hotarea=0
hotarea_corner=0
hotarea_size=10
overviewgappi=8
overviewgappo=30
overcircle_center_ratio=0.5
# Home-row-first labels for jump mode (Super+Shift+Tab -> press a letter)
jump_labels=ASDFGHJKLQWERTYUIOPZXCVBNM
jump_label_decorate_font_desc=monospace Bold 14
jump_label_decorate_corner_radius=8

# --- Focus / cursor (niri: input.kdl) ---------------------------------------
# niri: focus-follows-mouse max-scroll-amount="15%", warp-mouse-to-focus
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
exchange_cross_monitor=1
focus_cross_tag=0
focusdir_only_zone_overlap=0
cursor_size=24
cursor_theme=default
cursor_hide_timeout=0
cursor_hide_on_keypress=0
# niri: dnd-edge-view-scroll / drag windows into place
drag_tile_to_tile=1
drag_tile_small=1
drag_corner=4
drag_warp_cursor=1
enable_floating_snap=1
snap_distance=20

# --- Scratchpad (mango-only; Super+I / Super+Shift+I / Super+Ctrl+Z in binds.conf)
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.85
scratchpad_cross_monitor=1
single_scratchpad=1

# --- Appearance — niri runs with border + focus-ring off and 10px gaps ------
borderpx=0
no_border_when_single=0
gappih=10
gappiv=10
gappoh=10
gappov=10
# niri: layout { background-color "transparent" } — root is transparent so
# the wallpaper layer shows through (0x00000000). Colours are 0xRRGGBBAA.
rootcolor=0x00000000
bordercolor=0x57457fff
focuscolor=0xea9a97ff
urgentcolor=0x9b0000ff
maximizescreencolor=0x89aa61ff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
dropcolor=0xffc87f80
splitcolor=0xEB441EFF

# --- System -----------------------------------------------------------------
xwayland_persistence=1
xwayland_ignore_scale=0
syncobj_enable=1
allow_shortcuts_inhibit=1
allow_lock_transparent=0
axis_bind_apply_timeout=100
idleinhibit_ignore_visible=0
