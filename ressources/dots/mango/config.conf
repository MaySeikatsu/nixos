# Mango config — reconstructs the niri setup in ~/.config/nixos/ressources/dots/niri
# for this fundamentally different (dwl-based, tag/scroller) compositor.
# Full option reference: https://github.com/mangowm/mango/wiki
#
# NOTE: unlike niri's `include`, this file fully replaces /etc/mango/config.conf
# rather than layering on top of it, so every file below is self-contained.

source=~/.config/mango/input.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/rules.conf

# Window effect — mirrors niri's `blur { on passes 3 offset 3 noise 0.02 saturation 1.5 }`
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.5

border_radius=6
no_radius_when_single=0
# niri fades inactive windows to opacity 0.90 and the active one to 0.96
# (both with blur) via a pair of is-active/is-active=false window-rules.
focused_opacity=0.96
unfocused_opacity=0.90

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=5
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadowscolor=0x00000070

# Animations — mirrors niri's animations.kdl (slowdown 0.9, snappy springs)
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_move=250
animation_duration_open=200
animation_duration_tag=180
animation_duration_close=250
animation_duration_focus=0

# Scroller layout is mango's closest analogue to niri's horizontally
# scrolling column layout — every tag below is set to use it.
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.25,0.33,0.5,0.66,0.75,1.0

# Master-stack fallback, kept around for `switch_layout`
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Misc
no_border_when_single=0
focus_on_activate=1
sloppyfocus=1
warpcursor=1
cursor_size=24

# Appearance — niri runs with border + focus-ring both off and 10px gaps
borderpx=0
gappih=10
gappiv=10
gappoh=10
gappov=10

# Every tag runs the scroller layout, mirroring niri's scrolling-tiling model.
# Tag numbers stand in for niri's named workspaces, see rules.conf:
# 1 orga, 2 entertainment, 3 main, 4 work, 5 music
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
