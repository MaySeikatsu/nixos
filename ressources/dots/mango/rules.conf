# Window/layer rules — mirrors the window-rule blocks in niri's config.kdl.
# https://github.com/mangowm/mango/wiki/rules

# Float small utility windows
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:nm-connection-editor
windowrule=isfloating:1,appid:com.saivert.pwvucontrol
windowrule=isfloating:1,appid:org.pipewire.Helvum
windowrule=isfloating:1,appid:wdisplays
windowrule=isfloating:1,appid:qalculate-gtk
windowrule=isfloating:1,title:Syncthing Tray

# Picture-in-picture floats in a corner
windowrule=isfloating:1,offsetx:25,offsety:25,title:Picture-in-Picture

# Custom shell console floats in the top-left corner
windowrule=isfloating:1,offsetx:8,offsety:8,appid:shellseikatsu-console

# Route apps to tags, standing in for niri's named workspaces:
# 1 orga, 2 entertainment, 3 main, 4 work, 5 music
windowrule=tags:1,appid:obsidian
windowrule=tags:1,appid:ticktick
windowrule=tags:1,appid:todoist
windowrule=tags:1,title:obsidian-nvim

windowrule=tags:2,appid:vesktop
windowrule=tags:2,appid:signal
windowrule=tags:2,appid:Element
windowrule=tags:2,appid:BeeperTexts
windowrule=tags:2,appid:steam
windowrule=tags:2,title:spotify-tui

windowrule=tags:4,appid:teams-for-linux
windowrule=tags:4,appid:microsoft-edge

windowrule=tags:5,appid:tidal-hifi
windowrule=tags:5,appid:spotify

# Rofi opens/closes with a quick zoom, matching niri's layer-rule for rofi
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
