# Window / tag / layer rules — mirrors the window-rule blocks in niri's config.kdl.
# Reference: docs/window-management/rules.md in the mango source (0.16.3)
# appid/title are regexes. If both are given, both must match.

# --- Tags (niri named workspaces) ------------------------------------------
# niri declares workspace "orga" / "entertainment" / "main" / "work" so they
# always exist. no_hide:1 is mango's equivalent: the tag stays visible in the
# bar even when empty. Numbering: 1 orga, 2 entertainment, 3 main, 4 work,
# 5 music, 6-9 free-form (dynamic, hide when empty like niri's trailing empty
# workspace).
#
# Per-tag layouts (mango-only: niri has exactly one layout). Layouts:
#   tile scroller monocle grid deck center_tile dwindle fair
#   vertical_tile vertical_scroller vertical_grid vertical_deck vertical_fair
# `scroller` is the niri-style horizontally scrolling strip. Change a line
# here to give one tag a different default; `switch_layout`/`setlayout` in
# binds.conf change it at runtime.
tagrule=id:1,no_hide:1,layout_name:scroller
tagrule=id:2,no_hide:1,layout_name:scroller
tagrule=id:3,no_hide:1,layout_name:scroller
tagrule=id:4,no_hide:1,layout_name:scroller
tagrule=id:5,no_hide:1,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# --- Float small utility windows -------------------------------------------
# (niri: open-floating true). The nixpkgs blueman wrapper reports
# ".blueman-manager-wrapped" as its app-id — same string niri matches on.
windowrule=isfloating:1,appid:^\.blueman-manager-wrapped$
windowrule=isfloating:1,appid:^blueman-manager$
windowrule=isfloating:1,appid:^nm-connection-editor$
windowrule=isfloating:1,appid:^com\.saivert\.pwvucontrol$
windowrule=isfloating:1,appid:^org\.pipewire\.Helvum$
windowrule=isfloating:1,appid:^wdisplays$
windowrule=isfloating:1,appid:^qalculate-gtk$
windowrule=isfloating:1,title:^Syncthing Tray$

# Picture-in-picture floats in the bottom-right corner
# (niri: default-floating-position x=25 y=25 relative-to="bottom-right").
# mango offsets are % from centre, 100 = screen edge incl. outer gap.
windowrule=isfloating:1,offsetx:90,offsety:90,isnoanimation:1,title:^Picture-in-Picture$

# Steam notification toasts (niri: floating bottom-right)
windowrule=isfloating:1,offsetx:95,offsety:95,isnoanimation:1,appid:^steam$,title:^notificationtoasts_\d+_desktop$

# --- Custom shell / launcher popups -----------------------------------------
# shellseikatsu console floats top-left (niri: relative-to="top-left" x=8 y=8)
windowrule=isfloating:1,offsetx:-95,offsety:-95,appid:^shellseikatsu-console$
# fsel launcher (Super+A) floats, no shadow/radius interference
windowrule=isfloating:1,width:0.4,height:0.5,title:^fsel-launcher$

# --- Route apps to tags (niri: open-on-workspace) ---------------------------
# 1 orga
windowrule=tags:1,appid:^obsidian$
windowrule=tags:1,appid:^ticktick$
windowrule=tags:1,appid:^todoist$
windowrule=tags:1,title:^obsidian-nvim$
# 2 entertainment
windowrule=tags:2,appid:^vesktop$
windowrule=tags:2,appid:^signal$
windowrule=tags:2,appid:^Element$
windowrule=tags:2,appid:^BeeperTexts$
windowrule=tags:2,appid:^steam$
windowrule=tags:2,title:^spotify-tui$
# 4 work
windowrule=tags:4,appid:^teams-for-linux$
windowrule=tags:4,appid:^microsoft-edge$
# 5 music — niri also pins these to the AOC monitor via open-on-output.
# `monitor:` takes a monitor spec; model+serial mirrors monitors.conf.
windowrule=tags:5,monitor:model:25XV2Q F&&serial:11470AAAA4200,appid:^tidal-hifi$
windowrule=tags:5,monitor:model:25XV2Q F&&serial:11470AAAA4200,appid:^spotify$

# --- Screencast privacy (niri: block-out-from "screencast") -----------------
windowrule=shield_when_capture:1,appid:^org\.keepassxc\.KeePassXC$
windowrule=shield_when_capture:1,appid:^org\.gnome\.World\.Secrets$

# --- Named scratchpads (mango-only; Super+F1/F2/F3 in binds.conf) -----------
# Dropdown-style windows that launch on first use and toggle afterwards.
windowrule=isnamedscratchpad:1,width:0.7,height:0.6,appid:^scratch-term$
windowrule=isnamedscratchpad:1,width:0.8,height:0.75,appid:^scratch-files$
windowrule=isnamedscratchpad:1,width:0.6,height:0.7,appid:^scratch-music$

# --- Mango-only extras ------------------------------------------------------
# Games: let fullscreen games tear (allow_tearing=2 in monitors.conf) and
# skip the open/close animation so they don't get resized mid-launch.
windowrule=isnoanimation:1,force_tearing:1,appid:^steam_app_\d+$
windowrule=isnoanimation:1,force_tearing:1,appid:^gamescope$
# Tell zen the truth about its tiled state so it drops CSD shadows
# (niri: draw-border-with-background false)
windowrule=force_tiled_state:1,appid:^zen-twilight$

# --- Layer rules ------------------------------------------------------------
# Rofi zooms in/out (niri layer-rule for rofi)
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^rofi$
# slurp's selection overlay must not be blurred/animated or screenshots ghost
layerrule=noanim:1,noblur:1,layer_name:^selection$
# noctalia / quickshell bars & wallpaper: no window-style animation
layerrule=noanim:1,noblur:1,layer_name:^quickshell-wallpaper$
layerrule=noanim:1,layer_name:^quickshell-overview$
# Notifications never appear in screencasts (niri: block-out-from on ^notifications$)
layerrule=shield_when_capture:1,noanim:1,layer_name:^notifications$
