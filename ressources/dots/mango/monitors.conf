# Monitor rules — mirrors niri's outputs.kdl.
# Reference: docs/configuration/monitors.md in the mango source (0.16.3)
#
# IMPORTANT: in mango `name:` is the *connector* name (DP-2, HDMI-A-1, eDP-1),
# matched as a regex — NOT niri's "Make Model Serial" output string. Rules
# keyed on niri's names never matched, which is why mango ignored every
# resolution/refresh/scale/position here and fell back to preferred modes.
#
# Mango exposes make/model/serial as separate exact-match fields, which is
# what niri's string is built from ("Make Model Serial" -> make:, model:,
# serial:). Keying on model+serial keeps the rule stable across hosts where
# the same monitor lands on a different connector (PC: DP-2, laptop: the dock).
#
# Only the FIRST matching rule is applied to a given monitor, so a monitor
# that has both a PC and a laptop entry needs a comment toggle (see the MSI
# below). Values: rr (transform) normal=0, 90=1, 180=2, 270=3.
#
# XWayland gets broken click coordinates with negative monitor positions, so
# unlike outputs.kdl the layout here starts at 0,0 and extends right.
# Find connector/make/model/serial with `wlr-randr` or `mmsg get all-monitors`.

# --- PC Home ------------------------------------------------------------
# AOC 25XV2Q (secondary, left of the MSI): niri "PNP(AOP) 25XV2Q F 11470AAAA4200"
monitorrule=model:25XV2Q F,serial:11470AAAA4200,width:1920,height:1080,refresh:239.964,x:0,y:0,scale:1.0,rr:0,vrr:0
# MSI MAG 274URFW (primary): niri "Microstep MAG 274URFW 0x00000001"
# monitorrule=model:MAG 274URFW,serial:0x00000001,width:2560,height:1440,refresh:143.973,x:1920,y:0,scale:1.0,rr:0,vrr:1
monitorrule=model:MAG 274URFW,serial:0x00000001,width:3840,height:2160,refresh:143.973,x:1920,y:0,scale:1.0,rr:0,vrr:1

# --- Laptop -------------------------------------------------------------
monitorrule=name:^eDP-1$,width:2560,height:1600,refresh:60.002,x:0,y:0,scale:1.20,rr:0,vrr:1
monitorrule=name:^eDP-2$,width:2560,height:1600,refresh:165.002,x:0,y:0,scale:1.20,rr:0,vrr:1
# Same MSI monitor on the laptop dock (4K@120, scale 1.25 as in outputs.kdl).
# Unreachable while the PC rule above is active — swap the comments on the
# laptop host, or split this file per host in mangowm.nix.
# monitorrule=model:MAG 274URFW,serial:0x00000001,width:3840,height:2160,refresh:119.999,x:2134,y:0,scale:1.25,rr:0,vrr:0

# --- TV -----------------------------------------------------------------
# niri "Samsung Electric Company QCQ90S 0x01000E00". outputs.kdl put it at
# x=-2560 (left of the laptop panel); no x/y here so wlroots auto-places it to
# the right of eDP-1 instead of overlapping it or going negative.
monitorrule=model:QCQ90S,serial:0x01000E00,width:2560,height:1440,refresh:59.951,scale:1.25,rr:0,vrr:1
# niri "Philips Consumer Electronics Company PHILIPS FTV 0x01010101"
monitorrule=model:PHILIPS FTV,serial:0x01010101,width:1920,height:1080,refresh:60.0,scale:1.5,rr:0

# --- XREAL glasses ------------------------------------------------------
# niri "Nreal XREAL 1S Unknown" — no serial, so match make+model
monitorrule=make:Nreal,model:XREAL 1S,width:1920,height:1200,refresh:119.999,scale:1.25,rr:0

# Tearing (mango-only). 2 = only fullscreen windows may tear; combine with
# `windowrule=force_tearing:1,...` in rules.conf for specific games.
allow_tearing=2
