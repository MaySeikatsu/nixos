# Monitor rules — mirrors niri's outputs.kdl. Matching is by name, so only
# whichever monitor is actually connected on a given host takes effect; the
# rest are silently ignored. rr (transform) values: normal=0, 90=1, 180=2, 270=3
# https://github.com/mangowm/mango/wiki/monitors

# PC Home
monitorrule=name:PNP(AOP) 25XV2Q F 11470AAAA4200,width:1920,height:1080,refresh:239.964,x:-1920,y:0,scale:1.0,rr:0
monitorrule=name:Microstep MAG 274URFW 0x00000001,width:2560,height:1440,refresh:143.973,x:0,y:0,scale:1.0,rr:0,vrr:1

# Laptop
monitorrule=name:eDP-1,width:2560,height:1600,refresh:60.002,x:0,y:0,scale:1.20,rr:0,vrr:1
monitorrule=name:eDP-2,width:2560,height:1600,refresh:165.002,x:0,y:0,scale:1.20,rr:0,vrr:1
# Same physical monitor as above under the laptop dock, different mode (as in the source niri config)
monitorrule=name:Microstep MAG 274URFW 0x00000001,width:3840,height:2160,refresh:119.999,scale:1.25,rr:0

# TV
monitorrule=name:Samsung Electric Company QCQ90S 0x01000E00,width:2560,height:1440,refresh:59.951,x:-2560,y:0,scale:1.25,rr:0,vrr:1
monitorrule=name:Philips Consumer Electronics Company PHILIPS FTV 0x01010101,width:1920,height:1080,refresh:60.0,scale:1.5,rr:0

# XREAL glasses
monitorrule=name:Nreal XREAL 1S Unknown,width:1920,height:1200,refresh:119.999,scale:1.25,rr:0
