# Autostart — mirrors niri's init.kdl. xwayland-satellite isn't needed here:
# mango (dwl/wlroots-based) embeds native XWayland support directly.
# system76-scheduler-niri is niri-specific IPC integration and has no mango
# equivalent, so it's dropped rather than guessed at.
exec-once=plasma-polkit-agent
exec-once=ticktick
exec-once=obsidian
exec-once=foot --title obsidian-nvim -D ~/Documents/obsidian/ nvim .
exec-once=noctalia-shell
