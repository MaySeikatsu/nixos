# Autostart — mirrors niri's init.kdl.
# exec-once runs once at startup; exec re-runs on every reload_config.
#
# Not carried over from init.kdl:
#  - xwayland-satellite: mango (dwl/wlroots) embeds XWayland natively.
#  - system76-scheduler-niri: niri-IPC specific, no mango equivalent.
#  - xdg-desktop-portal-wlr: the NixOS programs.mango module writes
#    mango-portals.conf (ScreenCast/Screenshot=wlr) and xdg-desktop-portal
#    dbus-activates it on demand.
exec-once=plasma-polkit-agent
# noctalia: v5 (`noctalia`) is the default; v4 (`noctalia-shell`) stays
# installed as a fallback. Never run both at once.
# exec-once=noctalia-shell  # noctalia v4
exec-once=noctalia  # noctalia v5
exec-once=ticktick
exec-once=obsidian
exec-once=foot --title obsidian-nvim -D ~/Documents/obsidian/ nvim .

# niri: spawn-at-startup "niri" "msg" "action" "focus-workspace" "main".
# Mango starts on tag 1 (orga); jump to tag 3 (main) once the shell is up.
# Sleep so the tag switch lands after the exec-once windows above have been
# placed by their windowrules, otherwise they'd steal focus back.
exec-once=sh -c 'sleep 2; mmsg dispatch view,3,0'
