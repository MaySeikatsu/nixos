# Foot colours from kurashi's theme (modules/home-manager/theming/kurashi.nix). Replaces kurashi's bundled foot template,
# which writes [colors]: foot 1.28 rejects that section name. foot starts on the section named by initial-color-theme, which
# follows kurashi's scheme in effect. Both sections hold that scheme (kurashi renders one scheme at a time), so foot's
# colour-theme switch keys change nothing.
[main]
initial-color-theme={{scheme}}

[colors-dark]
background={{colors.surface.dark.hex_stripped}}
foreground={{colors.on_surface.dark.hex_stripped}}
selection-background={{colors.primary_container.dark.hex_stripped}}
selection-foreground={{colors.on_primary_container.dark.hex_stripped}}
regular0={{colors.surface.dark.hex_stripped}}
regular1={{colors.error.dark.hex_stripped}}
regular2={{colors.tertiary.dark.hex_stripped}}
regular3={{colors.secondary.dark.hex_stripped}}
regular4={{colors.primary.dark.hex_stripped}}
regular5={{colors.tertiary.dark.hex_stripped}}
regular6={{colors.secondary.dark.hex_stripped}}
regular7={{colors.on_surface.dark.hex_stripped}}
bright0={{colors.surface_container_high.dark.hex_stripped}}
bright1={{colors.error_container.dark.hex_stripped}}
bright2={{colors.tertiary_container.dark.hex_stripped}}
bright3={{colors.secondary_container.dark.hex_stripped}}
bright4={{colors.primary_container.dark.hex_stripped}}
bright5={{colors.on_tertiary_container.dark.hex_stripped}}
bright6={{colors.on_secondary_container.dark.hex_stripped}}
bright7={{colors.on_surface_variant.dark.hex_stripped}}

[colors-light]
background={{colors.surface.light.hex_stripped}}
foreground={{colors.on_surface.light.hex_stripped}}
selection-background={{colors.primary_container.light.hex_stripped}}
selection-foreground={{colors.on_primary_container.light.hex_stripped}}
regular0={{colors.surface.light.hex_stripped}}
regular1={{colors.error.light.hex_stripped}}
regular2={{colors.tertiary.light.hex_stripped}}
regular3={{colors.secondary.light.hex_stripped}}
regular4={{colors.primary.light.hex_stripped}}
regular5={{colors.tertiary.light.hex_stripped}}
regular6={{colors.secondary.light.hex_stripped}}
regular7={{colors.on_surface.light.hex_stripped}}
bright0={{colors.surface_container_high.light.hex_stripped}}
bright1={{colors.error_container.light.hex_stripped}}
bright2={{colors.tertiary_container.light.hex_stripped}}
bright3={{colors.secondary_container.light.hex_stripped}}
bright4={{colors.primary_container.light.hex_stripped}}
bright5={{colors.on_tertiary_container.light.hex_stripped}}
bright6={{colors.on_secondary_container.light.hex_stripped}}
bright7={{colors.on_surface_variant.light.hex_stripped}}
